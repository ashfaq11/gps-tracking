[project]
name = "gps-tracking"
version = "0.2.0"
description = "GT06 GPS ingestion gateway and REST API"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
api = ["asyncpg>=0.29", "fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["asyncpg>=0.29", "fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.27"]

[project.scripts]
gps-gateway = "gps_gateway.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gps_gateway", "gps_gateway.protocol", "gps_gateway.sinks", "api", "api.routers"]

[tool.ruff]
line-length = 100
