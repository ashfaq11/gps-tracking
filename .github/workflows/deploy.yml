# Test, then deploy to the AWS server, on every push to main.
#
# The deploy step SSHes in and runs deploy/aws/deploy.sh -- the same script
# a person would run by hand -- so there is one way to deploy, not two.
# Until the secrets below exist the deploy job skips with a notice instead
# of failing every merge. Setup: deploy/aws/README.md.
#
# Repository secrets:
#   DEPLOY_HOST         server address, e.g. 13.205.155.148
#   DEPLOY_USER         SSH user that can run docker (e.g. ubuntu)
#   DEPLOY_SSH_KEY      private key for that user (a deploy-only key)
#   DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan <host>`, so the server is
#                       verified rather than trusted on first use
#   DEPLOY_PATH         optional; the checkout on the server (/opt/gps-tracking)

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway through a restart.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -t .

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets
        id: secrets
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ] || [ -z "$KNOWN" ]; then
            echo "::notice title=Deploy skipped::Add DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS (see deploy/aws/README.md) to deploy automatically."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.secrets.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$USER@$HOST" "cd '${DEPLOY_PATH:-/opt/gps-tracking}' && ./deploy/aws/deploy.sh"
