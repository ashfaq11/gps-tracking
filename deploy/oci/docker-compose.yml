# GT06 ingestion gateway on an Oracle Cloud Always Free VM.
#
#   sudo docker compose --env-file /etc/gps-gateway.env up -d
#
# The API is not here -- it deploys to Vercel. This box exists to hold TCP
# sockets open, which serverless cannot do.

services:
  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: gps-gateway:latest
    container_name: gps-gateway
    restart: unless-stopped

    # Bind the host port explicitly. The OCI security list and the VM's own
    # firewall must BOTH allow 5023 -- see deploy/oci/README.md.
    ports:
      - "5023:5023"

    environment:
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "5023"
      GATEWAY_SINK: "postgres"
      GATEWAY_IDLE_TIMEOUT: "600"
      # Supabase session pooler (port 5432) keeps prepared statements usable.
      # Point at the 6543 transaction pooler instead and set this to 0.
      PG_STATEMENT_CACHE_SIZE: "100"
      PG_POOL_MIN: "1"
      PG_POOL_MAX: "5"
      # Supplied via --env-file so the password never lands in git.
      PG_DSN: "${PG_DSN:?set PG_DSN in /etc/gps-gateway.env}"

    # The free tier's smallest shape has 1 GB of RAM; keep the gateway from
    # taking all of it if a device storm bloats the buffers.
    deploy:
      resources:
        limits:
          memory: 512M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket;socket.create_connection(('127.0.0.1',5023),3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
